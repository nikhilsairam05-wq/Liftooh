<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Liftooh</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/signup.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="signup-container">

<div class="left-panel">

<img src="assets/images/logo.png" alt="Liftooh Logo">

<h1>Join Liftooh</h1>

<p>Create your account and start sharing rides today.</p>

</div>

<div class="right-panel">

<h2>Create Account</h2>

<form>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input type="text"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input type="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-phone"></i>

<input type="tel"
placeholder="Mobile Number"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input id="password"
type="password"
placeholder="Password"
required>

<i class="fa-solid fa-eye eye"
onclick="togglePassword('password')"></i>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input id="confirmPassword"
type="password"
placeholder="Confirm Password"
required>

<i class="fa-solid fa-eye eye"
onclick="togglePassword('confirmPassword')"></i>

</div>

<div class="terms">

<input type="checkbox" required>

<label>

I agree to the
<a href="#">Terms & Conditions</a>

</label>

</div>

<button type="submit">

Create Account

</button>

<p class="login-link">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</form>

</div>

</div>

<script src="assets/js/auth.js"></script>

</body>
</html>
