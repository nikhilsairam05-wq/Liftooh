<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Offer Ride | Liftooh</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/offer.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<a href="home.html">
<i class="fa-solid fa-arrow-left"></i>
</a>

<h2>Offer a Ride</h2>

<a href="profile.html">
<i class="fa-solid fa-user"></i>
</a>

</header>

<section class="offer-container">

<div class="form-card">

<h2>Share Your Ride</h2>

<p>Help others by offering a ride.</p>

<form>

<div class="input-group">

<label>Pickup Location</label>

<div class="input-box">

<i class="fa-solid fa-location-dot"></i>

<input type="text"
placeholder="Enter pickup location">

</div>

</div>

<div class="input-group">

<label>Destination</label>

<div class="input-box">

<i class="fa-solid fa-flag-checkered"></i>

<input type="text"
placeholder="Enter destination">

</div>

</div>

<div class="row">

<div class="input-group">

<label>Date</label>

<div class="input-box">

<i class="fa-solid fa-calendar"></i>

<input type="date">

</div>

</div>

<div class="input-group">

<label>Time</label>

<div class="input-box">

<i class="fa-solid fa-clock"></i>

<input type="time">

</div>

</div>

</div>

<div class="row">

<div class="input-group">

<label>Available Seats</label>

<div class="input-box">

<i class="fa-solid fa-chair"></i>

<input type="number"
min="1"
max="6"
placeholder="Seats">

</div>

</div>

<div class="input-group">

<label>Price / Seat</label>

<div class="input-box">

<i class="fa-solid fa-indian-rupee-sign"></i>

<input type="number"
placeholder="₹">

</div>

</div>

</div>

<div class="input-group">

<label>Vehicle Name</label>

<div class="input-box">

<i class="fa-solid fa-car"></i>

<input type="text"
placeholder="Car / Bike">

</div>

</div>

<div class="input-group">

<label>Vehicle Number</label>

<div class="input-box">

<i class="fa-solid fa-id-card"></i>

<input type="text"
placeholder="AP39 XX 1234">

</div>

</div>

<div class="input-group">

<label>Additional Notes</label>

<textarea
rows="4"
placeholder="Enter additional details..."></textarea>

</div>

<button class="publish-btn">

<i class="fa-solid fa-paper-plane"></i>

Publish Ride

</button>

</form>

</div>

</section>

<nav class="bottom-nav">

<a href="home.html">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>

<a href="offer-ride.html" class="active">

<i class="fa-solid fa-car"></i>

<span>Offer</span>

</a>

<a href="find-ride.html">

<i class="fa-solid fa-route"></i>

<span>Find</span>

</a>

<a href="profile.html">

<i class="fa-solid fa-user"></i>

<span>Profile</span>

</a>

</nav>

</body>
</html>
